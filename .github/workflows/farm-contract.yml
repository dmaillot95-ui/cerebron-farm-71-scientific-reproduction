name: CEREBRON F71 Farm Contract
on:
  push:
    paths: ['farm.json','.github/workflows/farm-contract.yml']
  workflow_dispatch:
jobs:
  validate-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate farm contract
        shell: python
        run: |
          import json
          p=json.load(open("farm.json"))
          assert p["farm_id"]==71
          assert "independent-replication" in p["capabilities"]
          assert "SHARED_DEPENDENCY!=INDEPENDENT_EVIDENCE" in p["rules"]
          print("F71_CONTRACT_VERIFIED")
