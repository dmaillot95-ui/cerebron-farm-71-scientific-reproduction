name: AGORA Recursive 5m Cycle
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: agora-recursive-${{ github.repository }}
  cancel-in-progress: false
jobs:
  recursive-state:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Restore durable state
        shell: bash
        run: |
          mkdir -p .agora-state
          if [ -f agora/state.json ]; then cp agora/state.json .agora-state/state.json; fi
      - name: Reproduce AVP-0001 independently
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, pathlib
          url="https://raw.githubusercontent.com/dmaillot95-ui/cerebron-omega-ai/main/config/farms.json"
          with urllib.request.urlopen(url, timeout=20) as r:
              d=json.load(r)
          farms=d["farms"]
          ids=[f["id"] for f in farms]
          repos=[f["repo"] for f in farms]
          checks={
            "json_parsed": True,
            "count_74": len(farms)==74,
            "ids_1_to_74": ids==list(range(1,75)),
            "ids_unique": len(set(ids))==len(ids),
            "repos_unique": len(set(repos))==len(repos)
          }
          result={
            "packet_id":"AVP-0001",
            "method":"independent recomputation from config/farms.json; E2 workflow result not used",
            "observations":{"farm_count":len(farms),"first_id":ids[0] if ids else None,"last_id":ids[-1] if ids else None},
            "checks":checks,
            "reproduction":"PASS" if all(checks.values()) else "FAIL"
          }
          pathlib.Path(".agora-state").mkdir(exist_ok=True)
          pathlib.Path(".agora-state/reproduction.json").write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - name: Build STATE(t+1)
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          p=".agora-state/state.json"
          try: parent=json.load(open(p))
          except Exception: parent={}
          rep=json.load(open(".agora-state/reproduction.json"))
          state={"schema":"AGORA_RECURSIVE_STATE_V2","state_id":os.environ["GITHUB_REPOSITORY"]+":"+os.environ["GITHUB_RUN_ID"],"parent_state_id":parent.get("state_id","GENESIS"),"iteration":int(parent.get("iteration",0))+1,"resource":os.environ["GITHUB_REPOSITORY"],"residual":parent.get("nextlock","BOOTSTRAP"),"claims":["AVP-0001:C1"],"evidence_ids":["AVP-0001:E1"],"questions":[],"errors":[],"anti_error_rules":parent.get("anti_error_rules",[]),"audit":"PENDING","red_team":"PENDING","reproduction":rep["reproduction"],"reproduction_observations":rep,"reality_gate":"PENDING","ablation":"PENDING","transfer":"PENDING","decision":"HOLD","nextlock":"REALITY_GATE" if rep["reproduction"]=="PASS" else "REPRODUCTION_FAILURE","rule":"WORKFLOW_EXECUTION!=LEARNING!=PROOF"}
          json.dump(state,open(p,"w"),indent=2)
          PY
          mkdir -p agora && cp .agora-state/state.json agora/state.json
      - name: Commit durable packet
        shell: bash
        run: |
          git config user.name "cerebron-agora-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agora/state.json
          git diff --cached --quiet && exit 0
          git commit -m "AGORA F71 reproduction state ${GITHUB_RUN_ID}"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: recursive-state-${{ github.run_id }}
          path: |
            agora/state.json
            .agora-state/reproduction.json
          retention-days: 14
